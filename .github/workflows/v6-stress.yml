name: V6 Master Engine Stress Test

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe | stills | clips | full'
        required: false
        default: 'full'
  push:
    paths:
      - '.github/workflows/v6-stress.yml'
      - 'stress/**'
      - 'v6/**'

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
      LP_NUM_THREADS: '4'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Mesa software OpenGL (EGL/llvmpipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libegl-mesa0 libgl1-mesa-dri libglx-mesa0 libgbm1

      - name: Engine dependencies
        run: pip install numpy Pillow moderngl av imageio-ffmpeg

      - name: Offline validation (V5 + V6)
        run: |
          python v6/validate_v5.py
          python v6/validate_v6.py

      - name: GL probe — boot the shipped V6 stage, measure frame cost
        run: python stress/probe.py

      - name: Stills — V3/V4/V5/V6 at identical times (V6-README A/B)
        if: ${{ github.event_name == 'push' || inputs.mode == 'full' || inputs.mode == 'stills' }}
        run: |
          for v in v3 v4 v5; do
            python v6/render_v5_stills.py --stage $v --times 5,20,45,180,380,630,900,1080 \
              --width 1280 --outdir stress/out/stills/$v
          done
          python v6/render_v6_stills.py --times 5,20,45,180,380,630,900,1080 \
            --width 1280 --outdir stress/out/stills/v6

      - name: Establishing stills (high resolution)
        if: ${{ github.event_name == 'push' || inputs.mode == 'full' || inputs.mode == 'stills' }}
        run: |
          python v6/render_v6_stills.py --times 20 --width 2560 --outdir stress/out/establishing
          python v6/render_v6_stills.py --times 5,45 --width 1920 --outdir stress/out/establishing-alt

      - name: Material close-up stills
        if: ${{ github.event_name == 'push' || inputs.mode == 'full' || inputs.mode == 'stills' }}
        run: |
          python v6/render_v6_stills.py --times 49.2,84,211.2,380,646,954 \
            --width 1920 --outdir stress/out/closeups

      - name: Review tooling (V6 contact sheet + exposure metrics)
        if: ${{ github.event_name == 'push' || inputs.mode == 'full' || inputs.mode == 'stills' }}
        run: python v6/review_v6.py stress/out/stills/v6/*.png --out stress/out/review

      - name: Moving-camera clips with inline temporal metrics
        if: ${{ github.event_name == 'push' || inputs.mode == 'full' || inputs.mode == 'clips' }}
        run: python stress/render_clips.py --outdir stress/out/clips --width 960 --fps 12 --budget 7200

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v6-stress-test
          path: stress/out
          retention-days: 7
